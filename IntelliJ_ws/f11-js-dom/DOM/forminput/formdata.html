<!DOCTYPE html>
<html lang="en">

<head>
    <meta http-equiv="Content-type" content="text/html; charset=UTF-8">
    <title>Demonstrasjon av valueAsNumber</title>

    <meta name="Author" content="Bjarte Wang-Kileng">

    <link rel="shortcut icon" href="#">
    <link href="../main.css" rel="stylesheet" type="text/css">
    <script src="formdata.js" defer></script>
</head>

<body>
<h1>Demonstrasjon av valueAsNumber</h1>
<div id="root">
    <fieldset data-date>
        <legend>date</legend>
        <label>Dato: <input type="date" value="2026-09-25"></label>
        <button type="button">Vis valueAsNumber</button>
    </fieldset>

    <fieldset data-datetime-local>
        <legend>datetime-local</legend>
        <label>Dato og tid: <input type="datetime-local" value="2026-09-25T23:15:27"></label>
        <button type="button">Vis valueAsNumber</button>
    </fieldset>

    <fieldset data-month>
        <legend>month - Ikke Safari eller Firefox</legend>
        <label>Måned: <input type="month" value="2026-09"></label>
        <button type="button">Vis valueAsNumber</button>
    </fieldset>

    <fieldset data-time>
        <legend>time</legend>
        <label>Tid: <input type="time" value="14:37:21"></label>
        <button type="button">Vis valueAsNumber</button>
    </fieldset>

    <fieldset data-week>
        <legend>week - Ikke Safari eller Firefox</legend>
        <label>Uke: <input type="week" value="2026-W39"></label>
        <button type="button">Vis valueAsNumber</button>
    </fieldset>
</div>
</body>

</html>
