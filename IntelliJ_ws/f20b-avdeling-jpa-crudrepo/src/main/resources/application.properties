spring.application.name=f20b-avdeling-jpa-crudrepo

## PostgreSQL-settings:
## - hxxxxxx er baade navnet paa databasen og brukernavn.
## - Kanskje passord er "pass" hvis du ikke husker det?
## spring.datasource.url=jdbc:postgresql://ider-database.westeurope.cloudapp.azure.com:5432/hxxxxxx
## spring.datasource.username=hxxxxxx
## spring.datasource.password=pass

## Min lokale database:
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=postgres

## Open Session in View
## https://www.baeldung.com/spring-open-session-in-view
## Det betyr at database-/EntityManager-sesjon knyttes til requesten.
## Dette gir mulighet til lazy-loading av samlinger i 1:N forhold.
## Har noen ulemper, men vi kommer ikke inn paa det her.
spring.jpa.open-in-view=true
